name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lastmod:check blames the case-study entries, so it needs the history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # package-lock.json is gitignored, so install resolves the ranges.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Content check
        run: npm run check:content

      - name: Sitemap dates
        run: npm run lastmod:check

      - name: Build
        run: npm run build
